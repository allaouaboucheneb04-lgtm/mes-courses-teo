name: Statistiques — filtres, calculs et interface iPhone

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "components/statistics-page.tsx"
      - "lib/statistics-period.ts"
      - "lib/comparison.ts"
      - "app/globals.css"
      - "tests/statistics-*.test.mjs"
      - "tests/comparison.test.mjs"
      - ".github/workflows/statistics-quality.yml"
  push:
    branches:
      - feat/statistiques-filtre-sev-design-20261106
    paths:
      - "components/statistics-page.tsx"
      - "lib/statistics-period.ts"
      - "app/globals.css"
      - "tests/statistics-*.test.mjs"
      - ".github/workflows/statistics-quality.yml"

permissions:
  contents: read

jobs:
  statistics-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --ignore-scripts
      - name: Vérifier TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Tester calculs et rendu statistiques
        run: |
          node --test --test-concurrency=1 \
            tests/comparison.test.mjs \
            tests/statistics-period.test.mjs \
            tests/statistics-ui.test.mjs
