name: Sécurité Firebase — séparation des chauffeurs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "quality-tests/firestore-access.test.mjs"
      - ".github/workflows/firestore-security.yml"
  push:
    branches:
      - "production/3000-chauffeurs"
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "quality-tests/firestore-access.test.mjs"
      - ".github/workflows/firestore-security.yml"

permissions:
  contents: read

jobs:
  test-firestore-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Installer les outils de test Firebase
        run: |
          npm ci --ignore-scripts --no-audit
          npm install --no-save --package-lock=false --ignore-scripts \
            @firebase/rules-unit-testing firebase-tools
      - name: Tester l'isolement des comptes dans l'émulateur
        run: |
          npx firebase emulators:exec --only firestore \
            --project demo-teo-security \
            "node --test quality-tests/firestore-access.test.mjs"
